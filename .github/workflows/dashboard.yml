name: Wakalor

on:
  push:
    branches: ["dashboard"]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - uses: actions/checkout@v4
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Check .env file for invalid characters
        run: |
          if [ -f .env ]; then
            cp .env .env.backup
            sed -i '/[{]/d' .env
            echo "Cleaned .env file of potential invalid characters"
          fi

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Directory Permissions
        run: chmod -R 775 storage bootstrap/cache ./deploy.sh

      - name: Make deploy script executable
        run: chmod +x deploy.sh

      - name: autoload
        run: composer dump-autoload
        continue-on-error: true

      - name: Clear Config
        run: php artisan config:clear
        continue-on-error: true

      - name: Clear route
        run: php artisan route:clear
        continue-on-error: true

      - name: Clear Cache
        run: php artisan cache:clear
        continue-on-error: true

      - name: Shut Down serve
        run: php artisan down
        continue-on-error: true

      - name: executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME }}
          port: "22"
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /www/wwwroot/dashboard.wakalor.com
            
            # Try to remove the problematic file before deployment
            echo ">> Handling problematic .user.ini file..."
            if [ -f public/.user.ini ]; then
              # Try multiple approaches to handle the file
              sudo rm -f public/.user.ini 2>/dev/null || \
              rm -f public/.user.ini 2>/dev/null || \
              sudo chmod 777 public/.user.ini 2>/dev/null || \
              chmod 777 public/.user.ini 2>/dev/null || \
              echo "Could not remove or change permissions on public/.user.ini"
            fi
            
            # Create a pre-deployment script to handle the file during git operations
            cat > handle_user_ini.sh << 'EOF'
            #!/bin/bash
            # This script will be used to handle the .user.ini file during deployment
            
            # Backup the current git hooks
            mkdir -p .git/hooks.backup
            [ -f .git/hooks/pre-reset ] && cp .git/hooks/pre-reset .git/hooks.backup/
            
            # Create a pre-reset hook to handle the file
            cat > .git/hooks/pre-reset << 'HOOK'
            #!/bin/bash
            if [ -f public/.user.ini ]; then
              rm -f public/.user.ini 2>/dev/null || chmod 777 public/.user.ini 2>/dev/null || true
            fi
            exit 0
            HOOK
            
            chmod +x .git/hooks/pre-reset
            EOF
            
            chmod +x handle_user_ini.sh
            ./handle_user_ini.sh
            
            # Run the deployment script
            ./deploy.sh || {
              echo "Deployment failed, trying alternative approach..."
              # If deploy.sh fails, try a direct git pull approach
              git fetch
              git checkout dashboard
              git pull origin dashboard || git reset --hard origin/dashboard
              
              # Run essential deployment steps
              composer install --no-dev --optimize-autoloader
              php artisan migrate --force
              php artisan optimize:clear
              chmod -R 777 storage bootstrap/cache
              php artisan up
            }
