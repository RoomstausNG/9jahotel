name: Wakalor

on:
  push:
    branches: ["dashboard"]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - uses: actions/checkout@v4
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Check .env file for invalid characters
        run: |
          if [ -f .env ]; then
            cp .env .env.backup
            sed -i '/[{]/d' .env
            echo "Cleaned .env file of potential invalid characters"
          fi

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Directory Permissions
        run: chmod -R 755 storage bootstrap/cache ./deploy.sh

      - name: Make deploy script executable
        run: chmod +x deploy.sh

      - name: autoload
        run: composer dump-autoload
        continue-on-error: true

      - name: Clear Config
        run: php artisan config:clear
        continue-on-error: true

      - name: Clear route
        run: php artisan route:clear
        continue-on-error: true

      - name: Clear Cache
        run: php artisan cache:clear
        continue-on-error: true

      - name: Shut Down serve
        run: php artisan down
        continue-on-error: true

      - name: executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME }}
          port: "22"
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /www/wwwroot/dashboard.wakalor.com
            # Fix permissions for problematic files
            [ -f public/.user.ini ] && chmod 644 public/.user.ini || true
            
            # Fix storage permissions before deployment
            echo ">> Setting storage permissions..."
            find storage -type d -exec chmod 775 {} \; 2>/dev/null || true
            find storage -type f -exec chmod 664 {} \; 2>/dev/null || true
            find bootstrap/cache -type d -exec chmod 775 {} \; 2>/dev/null || true
            find bootstrap/cache -type f -exec chmod 664 {} \; 2>/dev/null || true
            
            # Run deployment script with error handling
            ./deploy.sh || {
              echo "Deployment script failed, trying alternative approach..."
              git fetch
              git reset --hard origin/dashboard
              composer install --no-dev --optimize-autoloader
              php artisan migrate --force
              php artisan cache:clear
              php artisan config:clear
              php artisan route:clear
              php artisan view:clear
              
              # More thorough permission fixing
              echo ">> Setting detailed permissions..."
              find storage -type d -exec chmod 775 {} \; 2>/dev/null || true
              find storage -type f -exec chmod 664 {} \; 2>/dev/null || true
              find bootstrap/cache -type d -exec chmod 775 {} \; 2>/dev/null || true
              find bootstrap/cache -type f -exec chmod 664 {} \; 2>/dev/null || true
              
              # Create storage link if needed
              [ ! -L public/storage ] && php artisan storage:link || true
              
              php artisan up
              echo "Alternative deployment completed"
            }
