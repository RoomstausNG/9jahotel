name: Deploy to Production
on:
  push:
    branches: ["dashboard"]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Prepare deployment package
        run: |
          tar -czf deploy.tar.gz --exclude='.git' --exclude='node_modules' --exclude='.github' --exclude='.env' .

      - name: Upload package to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME }}
          port: 22
          key: ${{ secrets.PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME }}
          port: 22
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            # Create a temporary extraction directory
            mkdir -p /tmp/extract_temp

            # Extract the uploaded archive to the temp directory
            tar -xzf /tmp/deploy.tar.gz -C /tmp/extract_temp

            # Copy files to production directory, preserving .user.ini
            rsync -av --exclude='.git/' --exclude='public/.user.ini' /tmp/extract_temp/ /www/wwwroot/dashboard.wakalor.com/

            # Run post-deployment commands
            cd /www/wwwroot/dashboard.wakalor.com
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:clear

            # Clean up
            rm -rf /tmp/extract_temp
            rm /tmp/deploy.tar.gz
