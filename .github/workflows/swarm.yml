name: 🚀 Deploy to Docker Swarm

on:
  push:
    branches:
      - "swarm"

jobs:
  deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐳 SSH into VPS and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            echo "🔑 SSH access established"
            cd /www/wwwroot/v1.9jahotel.com
            echo "📂 Entered project directory"
            git reset --hard HEAD
            git pull production event
            echo "⚙️ Running deploy script..."
            chmod +x pm2.sh
            ./pm2.sh
