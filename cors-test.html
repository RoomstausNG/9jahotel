<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORS Test</title>
</head>

<body>
  <h1>CORS Test for Mobile App & Tauri</h1>
  <button onclick="testCORS()">Test API Call</button>
  <button onclick="testTauriCORS()">Test Tauri API Call</button>
  <div id="result"></div>

  <script>
    async function testCORS() {
      const resultDiv = document.getElementById('result');

      try {
        // Test the API endpoint
        const response = await fetch('http://localhost:3003/api/', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'X-Device-Type': 'mobile', // Custom header for mobile
            'X-App-Version': '1.0.0'   // Custom header for app version
          },
          credentials: 'include'
        });

        if (response.ok) {
          const data = await response.json();
          resultDiv.innerHTML = `
                        <h3>✅ CORS Test Successful!</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
        } else {
          resultDiv.innerHTML = `
                        <h3>❌ API Error</h3>
                        <p>Status: ${response.status}</p>
                        <p>Message: ${response.statusText}</p>
                    `;
        }
      } catch (error) {
        resultDiv.innerHTML = `
                    <h3>❌ CORS Error</h3>
                    <p>${error.message}</p>
                    <p>This might be due to CORS restrictions or server not running.</p>
                `;
      }
    }

    async function testTauriCORS() {
      const resultDiv = document.getElementById('result');

      try {
        // Test the API endpoint with Tauri-specific headers
        const response = await fetch('http://localhost:3003/api/', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'X-Device-Type': 'desktop', // Tauri is desktop
            'X-App-Version': '1.0.0',
            'User-Agent': 'Tauri App'
          },
          credentials: 'include'
        });

        if (response.ok) {
          const data = await response.json();
          resultDiv.innerHTML = `
                        <h3>✅ Tauri CORS Test Successful!</h3>
                        <p><strong>Origin:</strong> ${window.location.origin}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
        } else {
          resultDiv.innerHTML = `
                        <h3>❌ Tauri API Error</h3>
                        <p>Status: ${response.status}</p>
                        <p>Message: ${response.statusText}</p>
                        <p><strong>Origin:</strong> ${window.location.origin}</p>
                    `;
        }
      } catch (error) {
        resultDiv.innerHTML = `
                    <h3>❌ Tauri CORS Error</h3>
                    <p>${error.message}</p>
                    <p><strong>Origin:</strong> ${window.location.origin}</p>
                    <p>Make sure your Tauri app allows HTTP requests in tauri.conf.json</p>
                `;
      }
    }
  </script>
</body>

</html>
