services:
    wakalor:
        image: wakalor
        build:
            context: .
            dockerfile: Dockerfile
        deploy:
            replicas: 2
            update_config:
                parallelism: 1
                delay: 10s
            restart_policy:
                condition: on-failure
        ports:
            - "8002:8002"
        volumes:
            - .:/app
        environment:
            XDG_CONFIG_HOME: /var/www/html/config
            XDG_DATA_HOME: /var/www/html/data
            DB_HOST: mysql
            DB_PORT: 3306
            DATABASE_URL: ${DB_DATABASE:-wakalordb}
        networks:
            - baota_net
        depends_on:
            - redis

    redis:
        image: redis:alpine
        deploy:
            replicas: 1
        ports:
            - "16379:6379"
        networks:
            - baota_net
        volumes:
            - redis-data:/data

    queue:
        image: wakalor
        build: .
        command: ["php", "artisan", "queue:work"]
        depends_on:
            - redis
        networks:
            - baota_net

networks:
    baota_net:
        driver: overlay

volumes:
    redis-data:
        driver: local
