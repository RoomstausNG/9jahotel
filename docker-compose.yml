services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:3003"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - homematch
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always
    deploy:
      resources:
        limits:
          cpus: "12"
          memory: 10G
        reservations:
          cpus: "2"
          memory: 2G

  redis:
    image: redis:alpine
    ports:
      - "6382:6379"
    command: ["redis-server"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - redis_data:/data
    networks:
      - homematch
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: always

  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: myroomstatus
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ""
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - homematch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d myroomstatus"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  redis_data:
  app_data:
  postgres_data:

networks:
  homematch:
    external: true
