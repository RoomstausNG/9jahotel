version: "3.8"

services:
  app:
    image: 9jahotel:latest
    ports:
      - "3003:3003"
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          cpus: "4"
          memory: 4G
    env_file:
      - .env # Points to the .env file containing environment variables
    depends_on:
      - redis
    networks:
      - 9jahotel
    volumes:
      - app_data:/app/data # Persistent storage for app data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:alpine
    ports:
      - "6382:6379"
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - 9jahotel
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  app_data:

networks:
  9jahotel:
    driver: overlay
