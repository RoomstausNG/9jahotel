services:
  # Hono Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9jahotel:latest
    ports:
      - "3004:3004"
    deploy:
      mode: replicated
      replicas: 3
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "4"
          memory: 4G
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      # - POSTGRES_URL=postgresql://postgres_user:postgres_pass@postgres:5432/hono_db
      - POSTGRES_URL=postsql://postgres_user:postgres_pass@postgres:5432/hono_db
      - HONO_ADMIN_USER=admin
      - HONO_ADMIN_PASSWORD=secure_password
    depends_on:
      - redis
    networks:
      - 9jahotel

  # Redis Service
  redis:
    image: redis:alpine
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    command: ["redis-server", "--requirepass", "your_redis_password"]
    networks:
      - 9jahotel

