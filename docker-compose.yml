version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost:5000/9jahotel:v1.0.0
    ports:
      - "3003:3003"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - 9jahotel
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6382:6379"
    command: ["redis-server"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - redis_data:/data
    networks:
      - 9jahotel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: always

volumes:
  redis_data:
  app_data:

networks:
  9jahotel:
    driver: bridge
