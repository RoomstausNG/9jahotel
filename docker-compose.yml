services:
  app:
    image: 9jahotel:latest
    ports:
      - "3003:3003"
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: "6"
          memory: 8G
      restart_policy:
        condition: any # Restart under any condition, including failures and reboots
        delay: 5s # Wait 5 seconds before restarting
        max_attempts: 3 # Retry up to 3 times if the service fails
        window: 120s # Count failures within a 2-minute window
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - 9jahotel
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 1G
      restart_policy:
        condition: any # Restart under any condition, including failures and reboots
        delay: 5s
        max_attempts: 3
        window: 120s
    command: ["redis-server"]
    environment:
      REDIS_PASSWORD: ""
    volumes:
      - redis_data:/data
    networks:
      - 9jahotel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  redis_data:
  app_data:

networks:
  9jahotel:
    driver: overlay
