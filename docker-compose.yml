services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:3006"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - baota_net
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always
    deploy:
      resources:
        limits:
          cpus: "12"
          memory: 10G
        reservations:
          cpus: "2"
          memory: 2G

  redis:
    image: redis:alpine
    ports:
      - "6382:6379"
    command: ["redis-server"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - redis_data:/data
    networks:
      - baota_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: always

volumes:
  redis_data:
  app_data:
  postgres_data:

networks:
  baota_net:
    external: true
