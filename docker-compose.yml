services:
  app:
    image: 9jahotel:latest
    ports:
      - "3003:3003"
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: "4"
          memory: 4G
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
        interval: 30s
        timeout: 10s
        retries: 5 # Retries added here for app healthcheck
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - 9jahotel
    volumes:
      - app_data:/app/data
    restart_policy: # Ensures automatic restart if the app fails
      condition: on-failure
      max_attempts: 3 # Limit number of retries for restarts

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 5 # Retries added here for Redis healthcheck
    command: ["redis-server"]
    environment:
      REDIS_PASSWORD: ""
    volumes:
      - redis_data:/data
    networks:
      - 9jahotel
    restart_policy: # Ensures automatic restart if redis fails
      condition: on-failure
      max_attempts: 3 # Limit number of retries for restarts

volumes:
  redis_data:
  app_data:

networks:
  9jahotel:
    driver: overlay
