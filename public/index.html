<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9jahotel | Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white p-6">
    <div class="w-full max-w-7xl mx-auto">
        <div class="flex md:justify-between items-center">
            <div class=" top-5 left-5 flex items-center space-x-2">
                <img src="./img/9jahotel_logo.png" class="max-w-64 bg-white" alt="">
            </div>
            <p class=" top-5 right-5">Say hello! <a href="mailto:info@9jahotel.com"
                    class="underline">info@9jahotel.com</a>
            </p>
        </div>

        <div
            class="flex flex-col items-center md:flex-row w-full  justify-center md:justify-between h-screen gap-20 p-6 lg:p-0">
            <div class="space-y-16 md:space-y-24 lg:space-y-32 w-full md:w-2/3">
                <div class="">
                    <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold">We Are</h1>
                    <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold">Coming Soon</h1>
                </div>

                <div class="flex items-center space-x-4 font-black text-3xl md:text-5xl font-mono mt-6">
                    <div class="flex flex-col max-w-min items-center gap-2">
                        <span class="text-xl text-gray-400">Days</span>
                        <div id="days">00</div>
                    </div>
                    <span>:</span>
                    <div class="flex flex-col max-w-min items-center gap-2">
                        <span class="text-xl text-gray-400">Hours</span>
                        <div id="hours">00</div>
                    </div>
                    <span>:</span>
                    <div class="flex flex-col max-w-min items-center gap-2">
                        <span class="text-xl text-gray-400">Minutes</span>
                        <div id="minutes">00</div>
                    </div>
                    <span>:</span>
                    <div class="flex flex-col max-w-min items-center gap-2">
                        <span class="text-xl text-gray-400">Seconds</span>
                        <div id="seconds">00</div>
                    </div>
                </div>
            </div>
            <div class="bg-gray-600 lg:w-1/2 relative w-full ">
                <div class="relative">
                    <img src="./img/coming-soon.jpeg" alt="9jahotel | Coming Soon"
                        class="max-h-[600px] object-cover object-top w-full max-w-[450px] rounded-lg h-auto">
                </div>
                <p class="mt-6 font-mono max-w-[450px] text-lg">We're strong believers that the best solutions come from
                    gathering new
                    insights
                    and
                    pushing
                    conventional boundaries.</p>
            </div>
        </div>
    </div>


    <script>
        function startCountdown(targetDate) {
            function updateCountdown() {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance < 0) {
                    document.getElementById("days").textContent = "00";
                    document.getElementById("hours").textContent = "00";
                    document.getElementById("minutes").textContent = "00";
                    document.getElementById("seconds").textContent = "00";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("days").textContent = String(days).padStart(2, '0');
                document.getElementById("hours").textContent = String(hours).padStart(2, '0');
                document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
                document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        const launchDate = new Date("2025-05-15T00:00:00").getTime();
        startCountdown(launchDate);
    </script>
</body>

</html>
